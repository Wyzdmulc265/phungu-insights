name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Syntax + Worker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: gitleaks needs the PR base commit for range scans

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Dependency audit (fail on critical)
        run: npm audit --audit-level=critical

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Syntax check (Worker + maintenance scripts)
        run: |
          node --check src/worker.js
          for f in *.mjs; do node --check "$f"; done

      - name: Worker dry-run build (validates wrangler.toml + bundles)
        run: npx wrangler deploy --dry-run --outdir=dist

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: dist/
          retention-days: 7
